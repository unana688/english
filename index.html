<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="跟读英语本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>跟读英语本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: notebook — folder tabs on the left (chips on phone), entry cards on ruled paper, sticky player bar at the bottom */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#18213a; --muted:#5d6782; --rule:#dfe4ee;
  --accent:#2747c9; --accent-soft:#e6ebfb; --mark:#ffe36b; --mark-ink:#3d3200; --danger:#b42335; --ok:#18794e;
  --f-en:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141c; --sheet:#1a1f2b; --ink:#e8ecf6; --muted:#9aa4bd; --rule:#2a3142;
  --accent:#8ea4ff; --accent-soft:#232c4a; --mark:#e9c93a; --mark-ink:#1c1600; --danger:#ff7b8b; --ok:#5fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141c; --sheet:#1a1f2b; --ink:#e8ecf6; --muted:#9aa4bd; --rule:#2a3142;
  --accent:#8ea4ff; --accent-soft:#232c4a; --mark:#e9c93a; --mark-ink:#1c1600; --danger:#ff7b8b; --ok:#5fd3a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-en);font-weight:600;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-ui);font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
.accent-switch{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:3px}
.accent-switch button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted)}
.accent-switch button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.accent-switch b{font-family:var(--f-mono);font-size:.75rem;margin-right:4px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
/* folders */
.folders{display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.folders{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.folders::-webkit-scrollbar{display:none}}
.folder{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;background:none;text-align:left;padding:9px 12px;border-radius:10px;white-space:nowrap;color:var(--ink)}
.folder:hover{background:var(--sheet)}
.folder[aria-current="true"]{background:var(--sheet);border-color:var(--rule);font-weight:700}
.folder .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.folder.add{color:var(--accent);font-weight:500}
.folder-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (max-width:760px){.folder-tools{margin-top:4px}}
.link{border:0;background:none;color:var(--muted);font-size:.82rem;padding:4px 6px;border-radius:6px}
.link:hover{color:var(--ink);background:var(--sheet)}
.link.danger:hover{color:var(--danger)}
/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px;min-width:0}
input[type=search],input[type=text],textarea,select{font-size:16px;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;min-height:64px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1020}}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
/* editor */
.editor{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;gap:10px}
.editor .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.editor .row{grid-template-columns:minmax(0,1fr)}}
.editor label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.editor .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* entries */
.list{display:grid;gap:10px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 14px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.card.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.en{font-family:var(--f-en);font-size:1.3rem;line-height:1.35;word-break:break-word}
.card.sentence .en{font-size:1.12rem}
.en mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit}
.kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:8px;vertical-align:middle}
.zh{color:var(--ink);opacity:.85}
.note{color:var(--muted);font-size:.85rem}
.sample{font-size:.7rem;color:var(--mark-ink);background:var(--mark);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--sheet);display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor}
.mini{display:flex;flex-wrap:wrap;gap:4px;grid-column:1 / -1;border-top:1px dashed var(--rule);padding-top:8px;margin-top:4px}
.mini .link{font-size:.8rem}
.mini .link.on{color:var(--accent);font-weight:600}
.imp-head{display:flex;justify-content:space-between;align-items:center}
.imp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imp-list{display:grid;gap:6px}
.imp-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper)}
.imp-item input[type=checkbox]{width:20px;height:20px;margin-top:6px;accent-color:var(--accent)}
.imp-item .f{display:grid;gap:4px;min-width:0}
.imp-item input[type=text]{padding:6px 10px}
.imp-item .en-in{font-family:var(--f-en)}
.chips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-family:var(--f-en);font-size:1rem}
.chip.added{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tw{cursor:pointer;border-radius:4px;transition:background .15s}
.tw:hover,.tw:active{background:var(--accent-soft)}
.tw.known{border-bottom:2px dotted var(--accent)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -8px 30px rgba(0,0,0,.15);border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:10px}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-word{font-family:var(--f-en);font-size:2rem;font-weight:600}
.sh-ipa{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.sh-btns{display:flex;gap:8px;flex-wrap:wrap}
.sh-zh{font-size:1.05rem}
.sh-def{font-size:.85rem;color:var(--muted);max-height:6.5em;overflow:auto}
.sh-add{display:flex;gap:8px}
.sh-add input{flex:1;min-width:0}
.check{grid-column:1 / -1;border-radius:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);display:grid;gap:6px}
.check .words{font-family:var(--f-en);font-size:1.15rem;line-height:1.7;display:flex;flex-wrap:wrap;gap:2px 6px}
.check .w{border-radius:4px;padding:0 3px}
.check .w.ok{color:var(--ok)}
.check .w.bad{color:var(--danger);text-decoration:underline wavy;text-underline-offset:4px;cursor:pointer;background:none;border:0;font:inherit;padding:0 3px}
.check .heard{font-size:.85rem;color:var(--muted)}
.check .score{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.check .score.good{color:var(--ok)} .check .score.bad{color:var(--danger)}
.check .listening{color:var(--ok);font-weight:700}
.weakbar{font-size:.8rem;color:var(--danger)}
.weakbar b{font-family:var(--f-en);font-weight:600}
.folder.weak span:first-child{color:var(--danger)}
.rec{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px}
.rec audio{height:36px;max-width:100%}
.rec .hint{font-size:.8rem;color:var(--muted);flex-basis:100%}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
/* bottom player */
.player{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.player .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.player .now{flex:1 1 220px;min-width:0}
.player .now .t{font-family:var(--f-en);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now .s{font-size:.78rem;color:var(--muted)}
.player .now .s.go{color:var(--ok);font-weight:700}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.ctl label{display:flex;gap:6px;align-items:center}
.ctl input[type=range]{width:90px;accent-color:var(--accent)}
.ctl select{width:auto;max-width:150px;padding:5px 8px;font-size:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.meter{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s linear}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--danger)}
.status{font-size:.75rem;color:var(--muted)}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.88rem}
.backup{border-top:1px solid var(--rule);padding-top:8px}
@media (max-width:760px){.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.88rem}
.backup{border-top:0;padding-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>跟读英语本<small>单词 · 句子 · 美音/英音朗读 · 跟读练习</small></h1>
    <div class="accent-switch" role="group" aria-label="发音">
      <button id="acc-us" aria-pressed="true"><b>US</b>美音</button>
      <button id="acc-uk" aria-pressed="false"><b>UK</b>英音</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>
  <div class="layout">
    <aside>
      <nav class="folders" id="folders" aria-label="文件夹"></nav>
      <div class="folder-tools" id="folder-tools"></div>
      <div class="folder-tools backup">
        <button class="link" id="btn-export">⤓ 导出备份</button>
        <label class="link" for="imp" style="cursor:pointer">⤒ 导入备份</label>
        <input type="file" id="imp" accept=".json,application/json" hidden>
      </div>
      <p class="status" id="sync-status"></p>
    </aside>

    <main>
      <div class="bar">
        <input class="grow" type="search" id="q" placeholder="搜索英文或中文…" aria-label="搜索">
        <div class="seg" role="group" aria-label="类型筛选">
          <button data-f="all" aria-pressed="true">全部</button>
          <button data-f="word" aria-pressed="false">单词</button>
          <button data-f="sentence" aria-pressed="false">句子</button>
        </div>
        <button class="btn" id="btn-import">📷 截图导入</button>
        <button class="btn primary" id="btn-add">＋ 添加</button>
      </div>

      <form class="editor" id="editor" hidden>
        <div class="seg" role="group" aria-label="类型" id="ed-kind">
          <button type="button" data-k="word" aria-pressed="true">单词</button>
          <button type="button" data-k="sentence" aria-pressed="false">句子</button>
        </div>
        <div><button type="button" class="btn" id="ed-voice">🎤 说出来添加</button> <span class="status" id="ed-voice-st"></span></div>
        <label>英文<textarea id="ed-en" rows="2" placeholder="例如：resilient / I'd rather walk than take the bus." required></textarea></label>
        <div class="row">
          <label>中文意思<input type="text" id="ed-zh" placeholder="例如：有韧性的"></label>
          <label>放到文件夹<select id="ed-folder"></select></label>
        </div>
        <label>笔记（音标、例句、搭配，可不填）<input type="text" id="ed-note" placeholder="/rɪˈzɪliənt/  be resilient to …"></label>
        <div class="actions">
          <button type="button" class="btn" id="ed-preview">▶ 试听</button>
          <button type="button" class="btn" id="ed-cancel">取消</button>
          <button type="submit" class="btn primary" id="ed-save">保存</button>
        </div>
      </form>

      <section class="editor" id="importer" hidden aria-label="截图或粘贴导入">
        <div class="imp-head"><strong>截图识别 / 粘贴导入</strong><button type="button" class="link" id="imp-close">关闭</button></div>
        <p class="note">在新概念英语等不能复制的 App 里，截一张整页的图，一次就能导入整页句子，中文翻译会自动配对。可以一次选多张截图，也可以直接粘贴文字。</p>
        <div class="imp-row">
          <label class="btn" for="imp-img" style="cursor:pointer">📷 选择截图</label>
          <input type="file" id="imp-img" accept="image/*" multiple hidden>
          <label class="status" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="imp-zh" checked style="width:18px;height:18px;accent-color:var(--accent)"> 同时识别中文翻译</label>
          <span class="status" id="imp-status" style="flex-basis:100%"></span>
        </div>
        <div class="meter" id="imp-meter" hidden><i id="imp-bar"></i></div>
        <label>识别出的文字（可以修改）<textarea id="imp-text" rows="5" placeholder="识别结果会出现在这里，也可以直接粘贴文字"></textarea></label>
        <div class="actions" style="justify-content:flex-start">
          <button type="button" class="btn" id="imp-split">拆成句子 ↓</button>
        </div>
        <div id="imp-list" class="imp-list"></div>
        <div class="row" id="imp-foot" hidden>
          <label>放到文件夹<select id="imp-folder"></select></label>
          <label>或新建文件夹<input type="text" id="imp-newfolder" placeholder="例如：新概念 第二册 L1"></label>
        </div>
        <div class="actions" id="imp-actions" hidden>
          <button type="button" class="link" id="imp-all">全选 / 全不选</button>
          <button type="button" class="btn primary" id="imp-go">导入选中的</button>
        </div>
      </section>

      <div class="bar">
        <button class="btn" id="btn-playall">▶ 连续播放本文件夹</button>
        <button class="btn" id="btn-shadowall">🎙 跟读本文件夹</button>
        <span class="status" id="count"></span>
      </div>

      <div class="list" id="list"></div>
    </main>
  </div>
</div>

<div class="player" id="player">
  <div class="in">
    <div class="now">
      <div class="t" id="now-t">点任意条目的 ▶ 播放，或点「跟读」开始练习</div>
      <div class="s" id="now-s">小技巧：点句子里任意一个单词，可以单独听发音、看意思</div>
      <div class="meter"><i id="meter"></i></div>
    </div>
    <div class="ctl">
      <label>语速 <input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="0.9"> <span class="num" id="rate-v">0.90</span></label>
      <label>跟读遍数 <select id="reps"><option>1</option><option selected>2</option><option>3</option><option>5</option></select></label>
      <label>声音 <select id="voice"></select></label>
      <button class="btn" id="btn-stop">■ 停止</button>
    </div>
  </div>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="单词">
  <div class="sheet-in">
    <div class="sh-top"><span class="sh-word" id="sh-word"></span><button class="link" id="sh-close" aria-label="关闭">✕</button></div>
    <div class="sh-ipa" id="sh-ipa"></div>
    <div class="sh-btns">
      <button class="btn" id="sh-us">▶ 美音</button><button class="btn" id="sh-uk">▶ 英音</button><button class="btn" id="sh-slow">🐢 慢速</button>
    </div>
    <div class="sh-zh" id="sh-zh"></div>
    <div class="sh-def" id="sh-def"></div>
    <div class="sh-add"><input type="text" id="sh-zh-in" placeholder="中文意思（可修改）" aria-label="中文意思"><button class="btn primary" id="sh-add">＋ 加到单词本</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const LS_KEY="echo-notebook-v1", PREF_KEY="echo-notebook-prefs";

/* ---------- data ---------- */
function sampleData(){
  const f1=uid(),f2=uid();
  return {folders:[{id:f1,name:"日常口语"},{id:f2,name:"高频单词"}],items:[
    {id:uid(),folder:f2,kind:"word",en:"resilient",zh:"有韧性的；能迅速恢复的",note:"US /rɪˈzɪliənt/  be resilient to stress",sample:true,t:Date.now()-4000},
    {id:uid(),folder:f2,kind:"word",en:"schedule",zh:"日程表",note:"美音 /ˈskedʒuːl/，英音常读 /ˈʃedjuːl/，切换听听区别",sample:true,t:Date.now()-3000},
    {id:uid(),folder:f1,kind:"sentence",en:"Could you give me a hand with this?",zh:"你能帮我一下吗？",note:"give sb. a hand = 帮忙",sample:true,t:Date.now()-2000},
    {id:uid(),folder:f1,kind:"sentence",en:"I'd rather walk than take the bus today.",zh:"我今天宁愿走路也不坐公交。",note:"would rather A than B",sample:true,t:Date.now()-1000}
  ]};
}
let data=null;
try{const raw=localStorage.getItem(LS_KEY); if(raw) data=JSON.parse(raw);}catch(e){}

/* export / import */
function exportData(){
  const payload={app:"echo-notebook",version:1,exported:new Date().toISOString(),folders:data.folders,items:data.items};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const name=`跟读英语本-备份-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const file=new File([blob],name,{type:"application/json"});
  const touch=matchMedia("(pointer:coarse)").matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast("已导出 "+name);
}
function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.folders)||!Array.isArray(d.items)) throw 0;
      const fIds=new Set(data.folders.map(f=>f.id)), iIds=new Set(data.items.map(i=>i.id));
      let nf=0,ni=0;
      d.folders.forEach(f=>{if(f&&f.id&&f.name&&!fIds.has(f.id)){data.folders.push({id:f.id,name:String(f.name)});nf++;}});
      d.items.forEach(i=>{if(i&&i.id&&i.en&&!iIds.has(i.id)){data.items.push({id:i.id,folder:i.folder,kind:i.kind==="sentence"?"sentence":"word",en:String(i.en),zh:String(i.zh||""),note:String(i.note||""),t:+i.t||Date.now(),...(i.sample?{sample:true}:{}),...(i.weak?{weak:true}:{}),miss:+i.miss||0,streak:+i.streak||0,tries:+i.tries||0,...(i.wrong&&typeof i.wrong==="object"?{wrong:i.wrong}:{})});ni++;}});
      persist(); render(); toast(`导入完成：${nf} 个文件夹，${ni} 条内容`);
    }catch(e){toast("这个文件不是跟读英语本的备份，没有导入");}
  };

}

let runId=0;
function speak(text){
  return new Promise(res=>{
    if(!synth){toast("这个浏览器不支持朗读");return res(0);}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=prefs.accent; u.rate=prefs.rate;
    const list=voicesFor(prefs.accent), name=$("#voice").value;
    const v=list.find(x=>x.name===name)||list[0];
    if(v) u.voice=v;
    const t0=performance.now();
    let done=false; const fin=()=>{if(done)return;done=true;clearInterval(keep);res((performance.now()-t0)/1000);};
    u.onend=fin; u.onerror=fin;
    // Chrome pauses long utterances; nudge it
    const keep=setInterval(()=>{if(synth.speaking&&!synth.paused){synth.pause();synth.resume();}},10000);
    synth.speak(u);
  });
}
function wait(ms,id,onTick){
  return new Promise(res=>{const t0=performance.now();
    const step=()=>{if(id!==runId)return res(false);const p=(performance.now()-t0)/ms;onTick&&onTick(Math.min(1,p));if(p>=1)return res(true);requestAnimationFrame(step);};step();});
}

function markPlaying(id){document.querySelectorAll(".card").forEach(c=>c.classList.toggle("playing",c.dataset.id===id));

const accName=()=>prefs.accent==="en-GB"?"英音":"美音";

async function playItems(items,shadow){
  if(!items.length){toast("这个文件夹还没有内容");return;}
  if(synth) synth.cancel();
  const id=++runId;
  for(let i=0;i<items.length;i++){
    const it=items[i]; markPlaying(it.id);
    const reps=shadow?prefs.reps:1;
    for(let r=0;r<reps;r++){
      if(id!==runId) return;
      setNow(it.en,(items.length>1?`第 ${i+1}/${items.length} 条 · `:"")+`${accName()}原声`+(shadow?` · 第 ${r+1}/${reps} 遍`:""),"");
      $("#meter").style.width="0";
      const dur=await speak(it.en);
      if(id!==runId) return;
      if(shadow){
        const gap=Math.max(1.6,dur*1.35+0.6)*1000;
        setNow(it.en,"🎙 轮到你了，跟着读出来…","go");
        await wait(gap,id,p=>{$("#meter").style.width=(p*100)+"%";});
        $("#meter").style.width="0";
      }else{ await wait(500,id); }
    }
  }
  if(id===runId){setNow(shadow?"跟读完成 👏":"播放完成","可以换个口音再练一遍","");markPlaying(null);}
}

const CONTR={"i'm":"i am","i'd":"i would","i'll":"i will","i've":"i have","you're":"you are","it's":"it is","that's":"that is","don't":"do not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","didn't":"did not","doesn't":"does not","let's":"let us","we're":"we are","they're":"they are","what's":"what is","there's":"there is","he's":"he is","she's":"she is"};
function norm(w){return w.toLowerCase().replace(/[’‘`]/g,"'").replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,"");}
function expand(text){
  const out=[];
  text.split(/\s+/).forEach(raw=>{const w=norm(raw); if(!w) return;
    if(CONTR[w]) CONTR[w].split(" ").forEach(x=>out.push(x));
    else if(NUM[w]) out.push(NUM[w]);
    else out.push(w.replace(/'/g,""));});
  return out;
}
// original words with display text, each mapped to its expanded tokens
function origTokens(text){
  const shown=text.split(/\s+/).filter(Boolean), toks=[];
  shown.forEach((raw,i)=>expand(raw).forEach(t=>toks.push({t,i})));
  return {shown,toks};
}
function align(orig,heard){ // LCS: which orig tokens appear in order in heard
  const n=orig.length,m=heard.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  const eq=(a,b)=>a===b||(a.length>3&&b.length>3&&(a+"s"===b||b+"s"===a||a+"ed"===b||b+"ed"===a));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(orig[i],heard[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(eq(orig[i],heard[j])){hit[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
  return hit;
}
function grade(text,alternatives){
  const {shown,toks}=origTokens(text); let best=null;
  alternatives.forEach(h=>{const hit=align(toks.map(x=>x.t),expand(h));
    const okWord=shown.map((_,i)=>toks.filter(x=>x.i===i).every((x,k)=>hit[toks.indexOf(x)]));
    // words with no letters (e.g. "—") count as fine
    shown.forEach((w,i)=>{if(!toks.some(x=>x.i===i))okWord[i]=true;});
    const sc=okWord.filter(Boolean).length/shown.length;
    if(!best||sc>best.score) best={score:sc,marks:okWord,heard:h};});
  return {shown,...best};
}
function recordResult(it,res){

  it.tries=(it.tries||0)+1;

  if(wrong.length){
    it.miss=(it.miss||0)+1; it.streak=0;
    it.wrong=it.wrong||{}; wrong.forEach(w=>it.wrong[w]=(it.wrong[w]||0)+1);
    if(!it.weak){it.weak=true; it.weakSince=Date.now(); toast("已加入「常读错」");}
  }else{
    it.streak=(it.streak||0)+1;
    if(it.weak&&it.streak>=3){it.weak=false; toast("连续读对 3 次，已移出「常读错」👏");}
  }
  persist();
}
function startCheck(it){
  if(!SR){checks[it.id]={state:"unsupported"};render();return;}
  if(recog){try{recog.abort();}catch(e){}}
  if(synth) synth.cancel(); ++runId;
  const r=new SR(); recog=r; checking=it.id;
  r.lang=prefs.accent; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  checks[it.id]={state:"listening",heard:""}; render();
  setNow(it.en,"🎤 请现在读出来，读完停一下","go");
  let finalAlts=null, last="";
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    last=Array.from(e.results).map(x=>x[0].transcript).join(" ");
    if(res.isFinal){finalAlts=[];for(let k=0;k<res.length;k++)finalAlts.push(Array.from(e.results).slice(0,-1).map(x=>x[0].transcript).concat(res[k].transcript).join(" "));}
    const box=document.querySelector('.card[data-id="'+it.id+'"] .heard'); if(box) box.textContent="听到："+last;
  };

    const code=e.error;
    checks[it.id]={state:"error",msg:code==="not-allowed"||code==="service-not-allowed"?"没有麦克风权限。请在手机设置里允许浏览器使用麦克风和语音识别后再试。":code==="no-speech"?"没听到声音，请靠近一点再读一次。":"识别出错了，请再试一次。"};
  };

    recog=null; checking=null;
    const alts=finalAlts&&finalAlts.length?finalAlts:(last?[last]:null);
    if(alts){const g=grade(it.en,alts); checks[it.id]={state:"done",...g}; recordResult(it,g);
      setNow(it.en,g.score===1?"全部读对 ✅":"红色的单词没读准，点它听标准发音",g.score===1?"go":"");}
    else if(!checks[it.id]||checks[it.id].state==="listening") checks[it.id]={state:"error",msg:"没听到声音，请靠近一点再读一次。"};
    render();
  };
  try{r.start();}catch(e){checks[it.id]={state:"error",msg:"麦克风打不开，请稍后再试。"};render();}
}

/* ---------- tap a word: hear it, see meaning, add it ---------- */
function tapWords(text){
  return text.split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)||!tok) return tok;
    const m=tok.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z])([^A-Za-z]*)$/);
    if(!m) return esc(tok);
    const w=m[2].replace(/’/g,"'");
    return esc(m[1])+`<span class="tw${hasWord(w.replace(/'s$/i,""))?" known":""}" data-w="${esc(w)}">${esc(m[2])}</span>`+esc(m[3]);
  }).join("");
}
const DICT_KEY="echo-dict-cache";
let dictCache={}; try{dictCache=JSON.parse(localStorage.getItem(DICT_KEY)||"{}");}catch(e){}
function saveDict(){try{const k=Object.keys(dictCache);if(k.length>800)k.slice(0,200).forEach(x=>delete dictCache[x]);localStorage.setItem(DICT_KEY,JSON.stringify(dictCache));}catch(e){}}
async function lookup(w){
  const key=w.toLowerCase();
  if(dictCache[key]&&dictCache[key].done) return dictCache[key];
  const r={done:false,ipaUS:"",ipaUK:"",def:"",zh:""};
  const tasks=[
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(key)).then(x=>x.ok?x.json():null).then(j=>{
      if(!Array.isArray(j)) return;
      const ph=j.flatMap(e=>e.phonetics||[]).filter(p=>p.text);
      const us=ph.find(p=>/-us\./.test(p.audio||"")), uk=ph.find(p=>/-uk\./.test(p.audio||""));
      r.ipaUS=(us||ph[0]||{}).text||j[0].phonetic||""; r.ipaUK=(uk||{}).text||"";
      r.def=j.flatMap(e=>e.meanings||[]).slice(0,3).map(m=>m.partOfSpeech+". "+((m.definitions||[])[0]||{}).definition).join("\n");
    }).catch(()=>{}),
    fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(key)+"&langpair=en|zh-CN").then(x=>x.ok?x.json():null).then(j=>{
      const t=j&&j.responseData&&j.responseData.translatedText; if(t&&!/MYMEMORY|INVALID|QUOTA/i.test(t)&&t.toLowerCase()!==key) r.zh=t;
    }).catch(()=>{})
  ];
  await Promise.all(tasks);
  r.done=!!(r.ipaUS||r.zh||r.def);
  if(r.done){dictCache[key]=r;saveDict();}
  return r;
}

/* ---------- pick words from a sentence ---------- */
let pickFor=null;
const STOP=new Set("a an the i you he she it we they me him her us them my your his its our their is am are was were be been do does did to of in on at for with and or but so not no this that these those there here have has had will would can could shall should".split(" "));
function wordsOf(text){const seen=new Set();return text.split(/\s+/).map(w=>w.replace(/^[^A-Za-z]+|[^A-Za-z'-]+$/g,"").replace(/'s$/i,"")).filter(w=>w.length>1&&!seen.has(w.toLowerCase())&&seen.add(w.toLowerCase()));}
function hasWord(w){return data.items.some(i=>i.kind==="word"&&i.en.toLowerCase()===w.toLowerCase());}
function pickPanel(it){
  return `<div class="chips"><span class="status" style="flex-basis:100%">点单词，单独加到「${esc((data.folders.find(f=>f.id===it.folder)||{}).name||"")}」里背（已加过的会变蓝）：</span>${wordsOf(it.en).map(w=>`<button class="chip${hasWord(w)?" added":""}${STOP.has(w.toLowerCase())?" stop":""}" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>`;
}
function addWordFrom(it,w){
  if(synth){synth.cancel();++runId;speak(w);}
  if(hasWord(w)){toast("「"+w+"」已经在单词里了");return;}
  const lw=/^[A-Z][a-z]/.test(w)&&!/^I$/.test(w)?w.toLowerCase():w;
  data.items.push({id:uid(),t:Date.now(),kind:"word",en:lw,zh:"",note:"来自：" + it.en.slice(0,60),folder:it.folder});
  persist(); render(); toast("已添加单词「"+lw+"」，可以点编辑补上中文意思");
}

/* ---------- screenshot / paste import ---------- */
let tessLoad=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoad) return tessLoad;
  tessLoad=new Promise((res,rej)=>{const sc=document.createElement("script");
    sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload=()=>res(); sc.onerror=()=>{tessLoad=null;rej(new Error("load"));}; document.head.appendChild(sc);});
  return tessLoad;
}
const CJK=/[\u3400-\u9fff]/;
function cleanOCR(raw,keepZh){
  return raw.split(/\n/).map(l=>l.trim())
    .map(l=>CJK.test(l)?l.replace(/(?<![A-Za-z])\s+|\s+(?![A-Za-z])/g,"").replace(/,/g,"，").replace(/\?/g,"？").replace(/!/g,"！"):l.replace(/^[^A-Za-z0-9"'(]+/,""))
    .filter(l=>{if(!l) return false;
      if(CJK.test(l)) return keepZh&&(l.match(/[\u3400-\u9fff]/g)||[]).length>=2;
      const letters=(l.match(/[A-Za-z]/g)||[]).length; return letters>=2&&letters/l.replace(/\s/g,"").length>0.6;})
    .map(l=>l.replace(/[|]/g,"I").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s{2,}/g," "))
    .join("\n");
}
async function ocrFiles(files){
  const st=$("#imp-status"),meter=$("#imp-meter"),bar=$("#imp-bar");
  if(!files.length) return;
  st.textContent="正在准备识别（第一次要下载识别工具，需要联网，稍等一下）…"; meter.hidden=false; bar.style.width="5%";
  try{await loadTesseract();}catch(e){st.textContent="识别工具下载失败，请检查网络后再试。也可以直接把文字粘贴到下面的框里。";meter.hidden=true;return;}
  let worker;
  try{
    const zh=$("#imp-zh").checked;
    if(zh) st.textContent="正在准备识别（第一次要下载中英文识别工具，大约 20MB，请连 Wi-Fi 稍等）…";
    worker=await Tesseract.createWorker(zh?"eng+chi_sim":"eng",1,{logger:m=>{if(m.status==="recognizing text") bar.style.width=(10+m.progress*90)+"%";}});
    const out=[];
    for(let i=0;i<files.length;i++){
      st.textContent=`正在识别第 ${i+1}/${files.length} 张…`; bar.style.width="10%";
      const {data:{text}}=await worker.recognize(files[i]);
      out.push(cleanOCR(text,zh));
    }
    const ta=$("#imp-text"); ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+out.filter(Boolean).join("\n");
    st.textContent=out.join("").trim()?"识别完成，检查一下文字，再点「拆成句子」":"没有识别到英文，换一张更清楚的截图试试";
    if(out.join("").trim()) splitImport();
  }catch(e){st.textContent="识别出错了，请换一张截图再试。";}
  finally{meter.hidden=true; if(worker) worker.terminate();}
}
let impRows=[];
function sentences(flat){
  return (flat.match(/[^.!?]+(?:[.!?]+["')\]]*|$)/g)||[]).map(p=>p.trim()).filter(p=>/[A-Za-z]{2,}/.test(p));
}
function splitImport(){
  const lines=$("#imp-text").value.replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const groups=[]; let buf=[];
  lines.forEach(l=>{
    if(CJK.test(l)){
      if(buf.length){groups.push({en:buf.join(" "),zh:l});buf=[];}
      else if(groups.length) groups[groups.length-1].zh+=l;
    }else buf.push(l);
  });
  if(buf.length) groups.push({en:buf.join(" "),zh:""});
  const rows=[];
  groups.forEach(g=>{const en=g.en.replace(/\s+/g," ").trim();
    if(g.zh) rows.push({en,zh:g.zh}); else sentences(en).forEach(x=>rows.push({en:x,zh:""}));});
  impRows=rows.filter(r=>/[A-Za-z]{2,}/.test(r.en)).map(r=>({...r,
    // titles / menu text don't end like a sentence: leave them unticked
    on:/[.!?]["')\]]*$/.test(r.en)&&!data.items.some(i=>i.en.trim().toLowerCase()===r.en.toLowerCase())}));
  if(!impRows.length) toast("没有找到英文句子");
  renderImport();
}
function renderImport(){
  const L=$("#imp-list"); L.innerHTML="";
  impRows.forEach((r,i)=>{
    const d=document.createElement("div"); d.className="imp-item";
    const dup=data.items.some(x=>x.en.trim().toLowerCase()===r.en.trim().toLowerCase());
    d.innerHTML=`<input type="checkbox" id="imp-c${i}" ${r.on?"checked":""} aria-label="选择这一句">
      <div class="f"><input type="text" class="en-in" id="imp-e${i}" value="${esc(r.en)}" aria-label="英文">
      <input type="text" id="imp-z${i}" value="${esc(r.zh)}" placeholder="中文意思（可不填）" aria-label="中文意思">
      ${dup?'<span class="status">本子里已经有这一句了</span>':""}</div>
      <button type="button" class="link" aria-label="试听">▶</button>`;
    d.querySelector("input[type=checkbox]").onchange=e=>r.on=e.target.checked;
    d.querySelector(".en-in").oninput=e=>r.en=e.target.value;
    d.querySelector('[id^="imp-z"]').oninput=e=>r.zh=e.target.value;
    d.querySelector("button").onclick=()=>{if(synth)synth.cancel();++runId;speak(r.en);};
    L.appendChild(d);
  });
  const has=impRows.length>0;
  $("#imp-foot").hidden=!has; $("#imp-actions").hidden=!has;
  if(has){const sel=$("#imp-folder");sel.innerHTML="";
    data.folders.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.name;sel.appendChild(o);});
    if(data.folders.some(f=>f.id===cur)) sel.value=cur;}
}
function doImport(){
  const rows=impRows.filter(r=>r.on&&r.en.trim());
  if(!rows.length){toast("先勾选要导入的句子");return;}
  let folder=$("#imp-folder").value; const nf=$("#imp-newfolder").value.trim();
  if(nf){const f={id:uid(),name:nf};data.folders.push(f);folder=f.id;}
  if(!folder){const f={id:uid(),name:"我的生词"};data.folders.push(f);folder=f.id;}
  const t=Date.now();
  rows.forEach((r,k)=>{const en=r.en.trim().replace(/\s+/g," ");
    data.items.push({id:uid(),t:t+k,kind:en.split(" ").length>2?"sentence":"word",en,zh:r.zh.trim(),note:"",folder});});
  persist(); cur=folder; impRows=[]; $("#imp-text").value=""; $("#imp-newfolder").value=""; $("#imp-status").textContent="";
  renderImport(); $("#importer").hidden=true; render(); toast(`已导入 ${rows.length} 条`);
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>'};
function visibleItems(){
  const q=query.trim().toLowerCase();
  return data.items.filter(it=>(cur==="all"||(cur==="weak"?it.weak:it.folder===cur))&&(filter==="all"||it.kind===filter)&&
    (!q||(it.en+" "+it.zh+" "+(it.note||"")).toLowerCase().includes(q))).sort(cur==="weak"?((a,b)=>(b.miss||0)-(a.miss||0)):((a,b)=>a.t-b.t));
}
function render(){
  // folders
  const fEl=$("#folders"); fEl.innerHTML="";
  const mk=(id,name,n)=>{const b=document.createElement("button");b.className="folder";b.setAttribute("aria-current",String(cur===id));
    b.innerHTML=`<span>${esc(name)}</span><span class="n">${n}</span>`;b.onclick=()=>{cur=id;confirmFolder=false;render();};fEl.appendChild(b);};
  mk("all","全部",data.items.length);
  mk("weak","⚠ 常读错",data.items.filter(i=>i.weak).length); fEl.lastChild.classList.add("weak");
  data.folders.forEach(f=>mk(f.id,"📁 "+f.name,data.items.filter(i=>i.folder===f.id).length));
  const add=document.createElement("button");add.className="folder add";add.textContent="＋ 新建文件夹";add.onclick=newFolder;fEl.appendChild(add);
  // folder tools
  const tEl=$("#folder-tools"); tEl.innerHTML="";
  const f=data.folders.find(x=>x.id===cur);
  if(cur==="weak") tEl.innerHTML=`<span class="status">用「✓ 检查发音」读错的内容会自动放到这里；连续读对 3 次自动移出。</span>`;
  if(f){
    if(confirmFolder){
      const n=data.items.filter(i=>i.folder===f.id).length;
      tEl.innerHTML=`<span class="confirm">删除「${esc(f.name)}」和里面 ${n} 条？<button class="btn danger" id="fy">删除</button><button class="link" id="fn">取消</button></span>`;
      $("#fy").onclick=()=>{data.items=data.items.filter(i=>i.folder!==f.id);data.folders=data.folders.filter(x=>x.id!==f.id);cur="all";confirmFolder=false;persist();render();toast("文件夹已删除");};
      $("#fn").onclick=()=>{confirmFolder=false;render();};
    }else{
      tEl.innerHTML=`<button class="link" id="fr">重命名</button><button class="link danger" id="fd">删除文件夹</button>`;
      $("#fr").onclick=()=>renameFolder(f); $("#fd").onclick=()=>{confirmFolder=true;render();};
    }
  }
  // filter buttons
  document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===filter)));
  // list
  const items=visibleItems(), L=$("#list"); L.innerHTML="";
  $("#count").textContent=`${items.length} 条`;
  if(!items.length){L.innerHTML=`<div class="empty">${query?"没有找到匹配的内容":cur==="weak"?"还没有读错的内容。在任意条目上点「✓ 检查发音」，读错的会自动出现在这里":"这里还是空的。点右上角「＋ 添加」写下第一个单词或句子"}</div>`;return;}
  const qq=query.trim();
  items.forEach(it=>{
    const c=document.createElement("article");c.className="card "+it.kind;c.dataset.id=it.id;
    let en=it.kind==="sentence"&&!qq?tapWords(it.en):esc(it.en); if(qq){try{en=en.replace(new RegExp("("+qq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");}catch(e){}}
    const folderName=(data.folders.find(x=>x.id===it.folder)||{}).name||"";
    c.innerHTML=`<div style="min-width:0"><div class="en"><span class="kind">${it.kind==="word"?"word":"sentence"}</span>${en}${it.sample?'<span class="sample">示例</span>':""}</div>
      ${it.zh?`<div class="zh">${esc(it.zh)}</div>`:""}${it.note?`<div class="note">${esc(it.note)}</div>`:""}${weakInfo(it)}</div>
      <div class="side"><button class="play" aria-label="播放">${icon.play}</button></div>
      <div class="mini">
        <button class="link on" data-a="shadow">🎙 跟读</button>
        <button class="link on" data-a="chk">✓ 检查发音</button>
        <button class="link" data-a="rec">${mediaRec&&recFor===it.id?"⏺ 停止录音":"录我的跟读"}</button>
        ${recordings[it.id]?'<button class="link on" data-a="cmp">⇄ 对比原声</button>':""}
        <button class="link" data-a="edit">编辑</button>
        ${confirmItem===it.id?'<span class="confirm">确定删除？<button class="link danger" data-a="del-y">删除</button><button class="link" data-a="del-n">取消</button></span>':'<button class="link danger" data-a="del">删除</button>'}
        ${it.weak&&cur==="weak"?'<button class="link" data-a="unweak">移出常读错</button>':""}
        ${(cur==="all"||cur==="weak")&&folderName?`<span class="status" style="margin-left:auto">📁 ${esc(folderName)}</span>`:""}
      </div>
      ${checkPanel(it)}
      ${recFor===it.id&&!mediaRec&&!recordings[it.id]?`<div class="rec"><span class="hint">没能打开麦克风。请在手机设置里允许浏览器使用麦克风，或者先用手机录音，再选中录音文件放进来：</span>
        <input type="file" accept="audio/*" aria-label="选择录音文件"></div>`:""}
      ${recordings[it.id]?`<div class="rec"><span class="hint">你的跟读录音（已保存，再录一次会替换）</span><audio controls src="${recordings[it.id]}"></audio></div>`:""}`;
    c.querySelector(".play").onclick=()=>playItems([it],false);
    c.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==="shadow") playItems([it],true);
      else if(a==="edit") openEditor(it);

      else if(a==="del"){confirmItem=it.id;render();}
      else if(a==="del-n"){confirmItem=null;render();}
      else if(a==="del-y"){data.items=data.items.filter(x=>x.id!==it.id);recDel(it.id);confirmItem=null;persist();render();toast("已删除");}
      else if(a==="cmp") compare(it);
      else if(a==="chk") startCheck(it);
      else if(a==="chk-stop"){if(recog)try{recog.stop();}catch(e){}}
      else if(a==="chk-x"){delete checks[it.id];render();}
      else if(a==="unweak"){it.weak=false;it.streak=0;persist();render();toast("已移出「常读错」");}
      else if(a==="rec"){
        if(mediaRec&&recFor===it.id){mediaRec.stop();return;}
        if(mediaRec) mediaRec.stop();
        recFor=it.id;
        const ok=await startRecording(it.id);
        if(ok){setNow(it.en,"⏺ 正在录音，读完点「停止录音」","go");} else render();
      }
    });
    c.querySelectorAll(".tw").forEach(b=>b.onclick=e=>{e.stopPropagation();openWord(b.dataset.w,it);});
    c.querySelectorAll(".w.bad").forEach(b=>b.onclick=()=>{if(synth)synth.cancel();++runId;setNow(b.dataset.w,accName()+"标准发音","");speak(b.dataset.w);});
    const fi=c.querySelector('input[type=file]'); if(fi) fi.onchange=e=>attachFile(it.id,e.target.files[0]);
    L.appendChild(c);
  });
}

/* ---------- folders ---------- */
function inlineName(initial,onDone){
  const tEl=$("#folder-tools");
  tEl.innerHTML=`<form id="fnf" style="display:flex;gap:6px;width:100%"><input type="text" id="fn-in" maxlength="30" placeholder="文件夹名称" value="${esc(initial)}"><button class="btn primary">好</button></form>`;
  const inp=$("#fn-in"); inp.focus(); inp.select();
  $("#fnf").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){render();return;}onDone(v);};
  inp.onkeydown=e=>{if(e.key==="Escape")render();};
}
function newFolder(){inlineName("",name=>{const f={id:uid(),name};data.folders.push(f);cur=f.id;persist();render();toast("已新建「"+name+"」");});}
function renameFolder(f){inlineName(f.name,name=>{f.name=name;persist();render();});}

/* ---------- editor ---------- */
function setEdKind(k){edKind=k;document.querySelectorAll('#ed-kind [data-k]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));}
function openEditor(it){
  editingId=it?it.id:null;
  const sel=$("#ed-folder"); sel.innerHTML="";
  if(!data.folders.length){data.folders.push({id:uid(),name:"我的生词"});persist();}
  data.folders.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.name;sel.appendChild(o);});
  sel.value=it?it.folder:(data.folders.some(f=>f.id===cur)?cur:data.folders[0].id);
  $("#ed-en").value=it?it.en:""; $("#ed-zh").value=it?it.zh:""; $("#ed-note").value=it?(it.note||""):"";
  setEdKind(it?it.kind:"word"); $("#ed-save").textContent=it?"保存修改":"保存";
  $("#editor").hidden=false; $("#ed-en").focus(); $("#editor").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function closeEditor(){$("#editor").hidden=true;editingId=null;}
document.querySelectorAll('#ed-kind [data-k]').forEach(b=>b.onclick=()=>setEdKind(b.dataset.k));
$("#ed-en").addEventListener("input",e=>{const v=e.target.value.trim(); if(!editingId) setEdKind(/\s/.test(v)&&v.split(/\s+/).length>2?"sentence":"word");});
$("#ed-preview").onclick=()=>{const v=$("#ed-en").value.trim(); if(v){if(synth)synth.cancel();++runId;setNow(v,accName()+"试听","");speak(v);}};
$("#ed-cancel").onclick=closeEditor;
let edRec=null;
$("#ed-voice").onclick=()=>{
  const st=$("#ed-voice-st");
  if(!SR){st.textContent="这个浏览器不支持语音输入，可以用键盘上的🎤麦克风键代替";return;}
  if(edRec){try{edRec.stop();}catch(e){}return;}
  if(synth) synth.cancel();
  const r=new SR(); edRec=r; r.lang=prefs.accent; r.interimResults=true; r.continuous=false;
  const ta=$("#ed-en"), base=ta.value.trim();
  $("#ed-voice").textContent="■ 说完了"; st.textContent="请用英文读出这句话…";
  r.onresult=e=>{let t=Array.from(e.results).map(x=>x[0].transcript).join(" ").trim();
    if(t) t=t[0].toUpperCase()+t.slice(1);
    const last=e.results[e.results.length-1];
    if(last.isFinal&&t&&!/[.!?]$/.test(t)) t+=t.split(" ").length>2?".":"";
    ta.value=(base?base+" ":"")+t; ta.dispatchEvent(new Event("input"));};
  r.onerror=e=>{st.textContent=e.error==="not-allowed"||e.error==="service-not-allowed"?"没有麦克风权限，请在设置里允许":"没听清，请再说一次";};
  r.onend=()=>{edRec=null;$("#ed-voice").textContent="🎤 说出来添加"; if(!/没/.test(st.textContent)) st.textContent=ta.value.trim()?"识别好了，可以修改后保存":"";};
  try{r.start();}catch(e){edRec=null;}
};
$("#editor").onsubmit=e=>{
  e.preventDefault();
  const en=$("#ed-en").value.trim(); if(!en){toast("先写英文内容");return;}
  const rec={en,zh:$("#ed-zh").value.trim(),note:$("#ed-note").value.trim(),kind:edKind,folder:$("#ed-folder").value};
  if(editingId){const it=data.items.find(x=>x.id===editingId); Object.assign(it,rec); delete it.sample;}
  else data.items.push({id:uid(),t:Date.now(),...rec});
  persist(); const was=editingId; closeEditor();
  if(!was && cur!=="all" && cur!==rec.folder) cur=rec.folder;
  render(); toast(was?"已更新":"已添加");
  if(!was){ openEditor(); $("#ed-folder").value=rec.folder; setEdKind(rec.kind); }
};

$("#btn-shadowall").onclick=()=>playItems(visibleItems(),true);
$("#btn-stop").onclick=()=>{if(recog)try{recog.abort();}catch(e){}if(mediaRec)mediaRec.stop();stopAll();};
function setAccent(a){prefs.accent=a;savePrefs();$("#acc-us").setAttribute("aria-pressed",String(a==="en-US"));$("#acc-uk").setAttribute("aria-pressed",String(a==="en-GB"));fillVoiceSelect();
  if(voices.length&&!voicesFor(a).length) toast("这台设备没装"+(a==="en-GB"?"英音":"美音")+"语音，会用默认声音");}
$("#acc-us").onclick=()=>setAccent("en-US"); $("#acc-uk").onclick=()=>setAccent("en-GB");
$("#rate").value=prefs.rate; $("#rate-v").textContent=Number(prefs.rate).toFixed(2);
$("#rate").oninput=e=>{prefs.rate=+e.target.value;$("#rate-v").textContent=prefs.rate.toFixed(2);savePrefs();};
$("#reps").value=String(prefs.reps); $("#reps").onchange=e=>{prefs.reps=+e.target.value;savePrefs();};
$("#voice").onchange=e=>{prefs[prefs.accent==="en-GB"?"voiceUK":"voiceUS"]=e.target.value;savePrefs();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input,textarea,select")){if(mediaRec)mediaRec.stop();stopAll();}});
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200);}

setAccent(prefs.accent);
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
})();
</script>
</body>
</html>
