<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="跟读英语本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>跟读英语本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: notebook — folder tabs on the left (chips on phone), entry cards on ruled paper, sticky player bar at the bottom */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#18213a; --muted:#5d6782; --rule:#dfe4ee;
  --accent:#2747c9; --accent-soft:#e6ebfb; --mark:#ffe36b; --mark-ink:#3d3200; --danger:#b42335; --ok:#18794e;
  --f-en:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141c; --sheet:#1a1f2b; --ink:#e8ecf6; --muted:#9aa4bd; --rule:#2a3142;
  --accent:#8ea4ff; --accent-soft:#232c4a; --mark:#e9c93a; --mark-ink:#1c1600; --danger:#ff7b8b; --ok:#5fd3a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141c; --sheet:#1a1f2b; --ink:#e8ecf6; --muted:#9aa4bd; --rule:#2a3142;
  --accent:#8ea4ff; --accent-soft:#232c4a; --mark:#e9c93a; --mark-ink:#1c1600; --danger:#ff7b8b; --ok:#5fd3a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--f-en);font-weight:600;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-ui);font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:0}
.accent-switch{display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:3px}
.accent-switch button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted)}
.accent-switch button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.accent-switch b{font-family:var(--f-mono);font-size:.75rem;margin-right:4px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
/* folders */
.folders{display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){.folders{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.folders::-webkit-scrollbar{display:none}}
.folder{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid transparent;background:none;text-align:left;padding:9px 12px;border-radius:10px;white-space:nowrap;color:var(--ink)}
.folder:hover{background:var(--sheet)}
.folder[aria-current="true"]{background:var(--sheet);border-color:var(--rule);font-weight:700}
.folder .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.folder.add{color:var(--accent);font-weight:500}
.folder-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
@media (max-width:760px){.folder-tools{margin-top:4px}}
.link{border:0;background:none;color:var(--muted);font-size:.82rem;padding:4px 6px;border-radius:6px}
.link:hover{color:var(--ink);background:var(--sheet)}
.link.danger:hover{color:var(--danger)}
/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 180px;min-width:0}
input[type=search],input[type=text],textarea,select{font-size:16px;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:9px 12px}
textarea{resize:vertical;min-height:64px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0b1020}}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
/* editor */
.editor{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;gap:10px}
.editor .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.editor .row{grid-template-columns:minmax(0,1fr)}}
.editor label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.editor .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* entries */
.list{display:grid;gap:10px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 14px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.card.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.en{font-family:var(--f-en);font-size:1.3rem;line-height:1.35;word-break:break-word}
.card.sentence .en{font-size:1.12rem}
.en mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit}
.kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:8px;vertical-align:middle}
.zh{color:var(--ink);opacity:.85}
.note{color:var(--muted);font-size:.85rem}
.sample{font-size:.7rem;color:var(--mark-ink);background:var(--mark);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--sheet);display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor}
.mini{display:flex;flex-wrap:wrap;gap:4px;grid-column:1 / -1;border-top:1px dashed var(--rule);padding-top:8px;margin-top:4px}
.mini .link{font-size:.8rem}
.mini .link.on{color:var(--accent);font-weight:600}
.imp-head{display:flex;justify-content:space-between;align-items:center}
.imp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imp-list{display:grid;gap:6px}
.imp-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--paper)}
.imp-item input[type=checkbox]{width:20px;height:20px;margin-top:6px;accent-color:var(--accent)}
.imp-item .f{display:grid;gap:4px;min-width:0}
.imp-item input[type=text]{padding:6px 10px}
.imp-item .en-in{font-family:var(--f-en)}
.chips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 10px;font-family:var(--f-en);font-size:1rem}
.chip.added{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tw{cursor:pointer;border-radius:4px;transition:background .15s}
.tw:hover,.tw:active{background:var(--accent-soft)}
.tw.known{border-bottom:2px dotted var(--accent)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -8px 30px rgba(0,0,0,.15);border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:10px}
.sh-top{display:flex;justify-content:space-between;align-items:center}
.sh-word{font-family:var(--f-en);font-size:2rem;font-weight:600}
.sh-ipa{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.sh-btns{display:flex;gap:8px;flex-wrap:wrap}
.sh-zh{font-size:1.05rem}
.sh-def{font-size:.85rem;color:var(--muted);max-height:6.5em;overflow:auto}
.sh-add{display:flex;gap:8px}
.sh-add input{flex:1;min-width:0}
.sug{display:grid;gap:6px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px}
.sug .t{font-size:.8rem;color:var(--muted)}
.sug .opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 6px 5px 12px;font-family:var(--f-en);font-size:1rem}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .pl{border:0;background:none;padding:2px 6px;border-radius:999px;color:inherit;opacity:.75}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:.9rem!important;color:var(--ink)!important}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.img-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-prev{width:84px;height:84px;border-radius:12px;border:1px dashed var(--rule);display:grid;place-items:center;font-size:.75rem;color:var(--muted);overflow:hidden;background:var(--paper);flex:none}
.img-prev img{width:100%;height:100%;object-fit:cover}
.img-prev .emo{font-size:52px;line-height:1}
.img-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px;display:inline-grid;place-items:center}
.thumb.emo{font-size:26px;line-height:34px;text-align:center}
.alts{font-size:.85rem;color:var(--muted)}
.alts b{font-family:var(--f-en);font-weight:600;color:var(--ink)}
.folder.cards span:first-child{color:var(--accent)}
/* quiz */
.quiz{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.q-top{display:flex;align-items:center;gap:14px;max-width:560px;width:100%;margin:0 auto}
.q-top .q-score{color:var(--ok);font-weight:600}
.q-top #q-close{margin-left:auto}
.q-body{flex:1;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto;padding-top:10px}
.q-body h2{font-family:var(--f-ui);margin:6px 0 0;font-size:1.4rem}
.q-set{display:grid;gap:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px}
.q-set .lab{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.q-set .seg button{padding:9px 14px;font-size:.95rem}
.q-go{font-size:1.1rem;padding:14px;border-radius:14px}
.q-stage{perspective:1200px;display:flex;justify-content:center}
.q-card{position:relative;width:100%;min-height:300px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.q-card.flipped{transform:rotateY(180deg)}
.q-card.enter{animation:qin .4s ease-out}
@keyframes qin{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:20px;box-shadow:0 10px 30px rgba(20,30,60,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center}
.face.back{transform:rotateY(180deg)}
.q-tag{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.q-pic{max-width:100%;max-height:150px;border-radius:14px;object-fit:contain}
.q-pic.emo{font-size:110px;line-height:1.05}
.q-zh{font-size:1.5rem;font-weight:500;line-height:1.45;text-wrap:balance}
.q-en{font-family:var(--f-en);font-size:2rem;font-weight:600;line-height:1.25;text-wrap:balance;word-break:break-word}
.q-card.sentence .q-en{font-size:1.4rem}
.q-card.sentence .q-zh{font-size:1.25rem}
.q-alts{font-size:.95rem;color:var(--muted)}
.q-alts b{font-family:var(--f-en);color:var(--ink)}
.q-zh2{font-size:1rem;color:var(--muted)}
.q-diff{font-family:var(--f-mono);font-size:1rem;line-height:1.6;word-break:break-word}
.q-diff .ok{color:var(--ok)} .q-diff .bad{color:var(--danger);text-decoration:underline;text-underline-offset:3px;font-weight:700}
.q-diff .you{color:var(--muted);font-size:.85rem;display:block}
.q-status{min-height:1.6em;text-align:center;font-size:1.05rem;font-weight:500}
.q-status.go{color:var(--ok)} .q-status.bad{color:var(--danger)}
.q-heard{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.2em;font-family:var(--f-en)}
.q-form{display:flex;gap:8px}
.q-form input{flex:1;min-width:0;font-size:20px!important;padding:12px 14px!important;font-family:var(--f-en)}
.q-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.q-self{display:flex;gap:10px;justify-content:center}
.q-self .btn{padding:12px 18px;font-size:1rem}
.q-big{font-family:var(--f-mono);font-size:3rem;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.q-list{display:grid;gap:6px}
.q-list div{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 12px}
.q-list b{font-family:var(--f-en)}
.q-mic{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.check{grid-column:1 / -1;border-radius:10px;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);display:grid;gap:6px}
.check .words{font-family:var(--f-en);font-size:1.15rem;line-height:1.7;display:flex;flex-wrap:wrap;gap:2px 6px}
.check .w{border-radius:4px;padding:0 3px}
.check .w.ok{color:var(--ok)}
.check .w.bad{color:var(--danger);text-decoration:underline wavy;text-underline-offset:4px;cursor:pointer;background:none;border:0;font:inherit;padding:0 3px}
.check .heard{font-size:.85rem;color:var(--muted)}
.check .score{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.check .score.good{color:var(--ok)} .check .score.bad{color:var(--danger)}
.check .listening{color:var(--ok);font-weight:700}
.weakbar{font-size:.8rem;color:var(--danger)}
.weakbar b{font-family:var(--f-en);font-weight:600}
.folder.weak span:first-child{color:var(--danger)}
.rec{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px}
.rec audio{height:36px;max-width:100%}
.rec .hint{font-size:.8rem;color:var(--muted);flex-basis:100%}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
/* bottom player */
.player{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.player .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.player .now{flex:1 1 220px;min-width:0}
.player .now .t{font-family:var(--f-en);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .now .s{font-size:.78rem;color:var(--muted)}
.player .now .s.go{color:var(--ok);font-weight:700}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.ctl label{display:flex;gap:6px;align-items:center}
.ctl input[type=range]{width:90px;accent-color:var(--accent)}
.ctl select{width:auto;max-width:150px;padding:5px 8px;font-size:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.meter{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s linear}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--danger)}
.status{font-size:.75rem;color:var(--muted)}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.88rem}
.backup{border-top:1px solid var(--rule);padding-top:8px}
@media (max-width:760px){.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.88rem}
.backup{border-top:0;padding-top:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>跟读英语本<small>单词 · 句子 · 美音/英音朗读 · 跟读练习</small></h1>
    <div class="accent-switch" role="group" aria-label="发音">
      <button id="acc-us" aria-pressed="true"><b>US</b>美音</button>
      <button id="acc-uk" aria-pressed="false"><b>UK</b>英音</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>
  <div class="layout">
    <aside>
      <nav class="folders" id="folders" aria-label="文件夹"></nav>
      <div class="folder-tools" id="folder-tools"></div>
      <div class="folder-tools backup">
        <button class="link" id="btn-export">⤓ 导出备份</button>
        <label class="link" for="imp" style="cursor:pointer">⤒ 导入备份</label>
        <input type="file" id="imp" accept=".json,application/json" hidden>
      </div>
      <p class="status" id="sync-status"></p>
    </aside>

    <main>
      <div class="bar">
        <input class="grow" type="search" id="q" placeholder="搜索英文或中文…" aria-label="搜索">
        <div class="seg" role="group" aria-label="类型筛选">
          <button data-f="all" aria-pressed="true">全部</button>
          <button data-f="word" aria-pressed="false">单词</button>
          <button data-f="sentence" aria-pressed="false">句子</button>
        </div>
        <button class="btn" id="btn-import">📷 截图导入</button>
        <button class="btn primary" id="btn-add">＋ 添加</button>
      </div>

      <form class="editor" id="editor" hidden>
        <div class="seg" role="group" aria-label="类型" id="ed-kind">
          <button type="button" data-k="word" aria-pressed="true">单词</button>
          <button type="button" data-k="sentence" aria-pressed="false">句子</button>
        </div>
        <div><button type="button" class="btn" id="ed-voice">🎤 说出来添加</button> <span class="status" id="ed-voice-st"></span></div>
        <label>英文（也可以输入中文，会列出几种英文说法）<textarea id="ed-en" rows="2" placeholder="例如：resilient　或者输入中文：橘子" required></textarea></label>

<script>
(function(){
"use strict";
const NET_PREFIX="net:";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const LS_KEY="echo-notebook-v1", PREF_KEY="echo-notebook-prefs";

/* ---------- data ---------- */
function sampleData(){
  const f1=uid(),f2=uid();
  return {folders:[{id:f1,name:"日常口语"},{id:f2,name:"高频单词"}],items:[
    {id:uid(),folder:f2,kind:"word",en:"resilient",zh:"有韧性的；能迅速恢复的",note:"US /rɪˈzɪliənt/  be resilient to stress",sample:true,t:Date.now()-4000},
    {id:uid(),folder:f2,kind:"word",en:"schedule",zh:"日程表",note:"美音 /ˈskedʒuːl/，英音常读 /ˈʃedjuːl/，切换听听区别",sample:true,t:Date.now()-3000},
    {id:uid(),folder:f1,kind:"sentence",en:"Could you give me a hand with this?",zh:"你能帮我一下吗？",note:"give sb. a hand = 帮忙",sample:true,t:Date.now()-2000},
    {id:uid(),folder:f1,kind:"sentence",en:"I'd rather walk than take the bus today.",zh:"我今天宁愿走路也不坐公交。",note:"would rather A than B",sample:true,t:Date.now()-1000}
  ]};
}
let data=null;
try{const raw=localStorage.getItem(LS_KEY); if(raw) data=JSON.parse(raw);}catch(e){}
if(!data||!Array.isArray(data.folders)) data=sampleData();
let prefs={accent:"en-US",rate:0.9,reps:2,voiceUS:"",voiceUK:"",gender:"f"};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF_KEY)||"{}"));}catch(e){}
let cur="all", filter="all", query="", editingId=null, edKind="word", confirmFolder=false, confirmItem=null, recFor=null;
const recordings={}; // itemId -> objectURL (this session only)

/* ---------- local save ---------- */
const statusEl=$("#sync-status");
function setStatus(t){statusEl.textContent=t;}
function persist(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(data));setStatus("已保存在本机 · 记得定期导出备份");}
  catch(e){setStatus("保存失败：手机存储可能已满");}
}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}catch(e){}}
setStatus("已保存在本机 · 记得定期导出备份");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* recordings kept in IndexedDB so they survive closing the app */
const recDB=new Promise(res=>{
  try{const r=indexedDB.open("echo-recordings",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("rec");
    r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);}
});
async function recPut(id,blob){const db=await recDB;if(!db)return;try{db.transaction("rec","readwrite").objectStore("rec").put(blob,id);}catch(e){}}
async function recDel(id){const db=await recDB;if(!db)return;try{db.transaction("rec","readwrite").objectStore("rec").delete(id);}catch(e){}}
(async()=>{const db=await recDB;if(!db)return;
  try{const st=db.transaction("rec").objectStore("rec");const req=st.openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){recordings[c.key]=URL.createObjectURL(c.value);c.continue();}else render();};}catch(e){}})();

/* export / import */
function exportData(){
  const payload={app:"echo-notebook",version:1,exported:new Date().toISOString(),folders:data.folders,items:data.items};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const name=`跟读英语本-备份-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  const file=new File([blob],name,{type:"application/json"});
  const touch=matchMedia("(pointer:coarse)").matches;
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast("已导出 "+name);
}
function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.folders)||!Array.isArray(d.items)) throw 0;
      const fIds=new Set(data.folders.map(f=>f.id)), iIds=new Set(data.items.map(i=>i.id));
      let nf=0,ni=0;
      d.folders.forEach(f=>{if(f&&f.id&&f.name&&!fIds.has(f.id)){data.folders.push({id:f.id,name:String(f.name)});nf++;}});
      d.items.forEach(i=>{if(i&&i.id&&i.en&&!iIds.has(i.id)){data.items.push({id:i.id,folder:i.folder,kind:i.kind==="sentence"?"sentence":"word",en:String(i.en),zh:String(i.zh||""),note:String(i.note||""),t:+i.t||Date.now(),...(i.sample?{sample:true}:{}),...(i.weak?{weak:true}:{}),miss:+i.miss||0,streak:+i.streak||0,tries:+i.tries||0,...(i.wrong&&typeof i.wrong==="object"?{wrong:i.wrong}:{}),...(Array.isArray(i.alts)?{alts:i.alts.map(String)}:{}),...(i.img?{img:String(i.img)}:{}),...(i.card?{card:true}:{}),qRight:+i.qRight||0,qWrong:+i.qWrong||0});ni++;}});
      persist(); render(); toast(`导入完成：${nf} 个文件夹，${ni} 条内容`);
    }catch(e){toast("这个文件不是跟读英语本的备份，没有导入");}
  };
  r.readAsText(file);
}

/* ---------- speech ---------- */
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){
  if(!synth) return;
  voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  fillVoiceSelect();
}
function voicesFor(acc){
  const re=acc==="en-GB"?/^en[-_](GB|UK)/i:/^en[-_]US/i;
  return voices.filter(v=>re.test(v.lang));
}
/* Known native voices. Order = preference (most natural first). */
const FEMALE={
  "en-US":["ava","samantha","allison","susan","zoe","nicky","evan_none","aria","jenny","michelle","ana","emma","google us english","female","joanna","salli","kendra","kimberly","ivy","victoria","karen_none"],
  "en-GB":["serena","kate","stephanie","martha","sonia","libby","maisie","mia","google uk english female","female","amy","emma","fiona_none"]
};
const MALE={
  "en-US":["evan","tom","alex","aaron","fred","nathan","guy","eric","davis","jason","tony","andrew","brian","christopher","google us english male","male","matthew","joey","justin"],
  "en-GB":["daniel","arthur","oliver","ryan","thomas","george","google uk english male","male","brian"]
};
const QUALITY=/premium|enhanced|neural|natural|online|향상|고품질|增强|高品质/i;
function voiceGender(v,acc){
  const n=v.name.toLowerCase();
  const hit=list=>list.findIndex(k=>!k.endsWith("_none")&&n.includes(k));
  const f=hit(FEMALE[acc]||[]), m=hit(MALE[acc]||[]);
  if(/\bfemale\b/.test(n)) return {g:"f",rank:f<0?50:f};
  if(/\bmale\b/.test(n)) return {g:"m",rank:m<0?50:m};
  if(f>=0&&(m<0||f<=m)) return {g:"f",rank:f};
  if(m>=0) return {g:"m",rank:m};
  return {g:"?",rank:99};
}
function rankVoices(list,acc,gender){
  return list.map(v=>{const x=voiceGender(v,acc);return {v,...x,score:(x.g===gender?0:x.g==="?"?200:400)+x.rank-(QUALITY.test(v.name)?30:0)-(v.localService===false?5:0)};})
    .sort((a,b)=>a.score-b.score);
}
function fillVoiceSelect(){
  const sel=$("#voice"), raw=voicesFor(prefs.accent);
  const g=prefs.gender||"f";
  const ranked=rankVoices(raw,prefs.accent,g);
  // online female voice: preferred over a wrong-gender local voice, after real local female voices
  const net={v:{name:NET_PREFIX+prefs.accent,lang:prefs.accent},g:"f",net:true,score:g==="f"?150:350};
  const at=ranked.findIndex(r=>r.score>net.score); if(at<0) ranked.push(net); else ranked.splice(at,0,net);
  const list=ranked.map(r=>r.v);
  $("#g-f")&&$("#g-f").setAttribute("aria-pressed",String((prefs.gender||"f")==="f"));
  $("#g-m")&&$("#g-m").setAttribute("aria-pressed",String(prefs.gender==="m"));
  const key=prefs.accent==="en-GB"?"voiceUK":"voiceUS";
  sel.innerHTML="";
  if(!list.length){const o=document.createElement("option");o.value="";o.textContent="系统默认";sel.appendChild(o);return;}
  ranked.forEach(r=>{const o=document.createElement("option");o.value=r.v.name;
    if(r.net){o.textContent="♀ 网络"+(prefs.accent==="en-GB"?"英音":"美音")+"女声（需联网）";sel.appendChild(o);return;}
    o.textContent=(r.g==="f"?"♀ ":r.g==="m"?"♂ ":"")+r.v.name.replace(/^(Microsoft|Google|com\.apple\.[^.]+\.)\s*/i,"").replace(/\s*-\s*English.*$/i,"").slice(0,26);sel.appendChild(o);});
  const saved=list.find(v=>v.name===prefs[key]);
  const savedG=saved?(saved.name.startsWith(NET_PREFIX)?"f":voiceGender(saved,prefs.accent).g):"";
  const pref=(saved&&savedG!==(prefs.gender==="m"?"f":"m"))?saved:list[0];
  sel.value=pref.name;
  const best=ranked[0];
  const n=$("#notice");
  if(n) n.hidden=true;
  if(n&&best&&best.g!==(prefs.gender||"f")&&voices.length){
    n.textContent=(prefs.gender==="m"?"这台设备没有":"这台设备暂时没有")+(prefs.accent==="en-GB"?"英音":"美音")+(prefs.gender==="m"?"男声":"女声")+"。iPhone/iPad：설정 → 손쉬운 사용 → 읽기 및 말하기 → 음성 → 영어，下载一个（美音推荐 Ava，英音推荐 Serena 或 Kate）。安卓/华为：设置 →「文字转语音」里下载英语语音包。";
    n.hidden=false;
  }
}
if(synth){loadVoices(); if(synth.addEventListener) synth.addEventListener("voiceschanged",loadVoices); else synth.onvoiceschanged=loadVoices;}
else{const n=$("#notice");n.textContent="这个浏览器不支持朗读。请换用系统自带浏览器（iPhone/iPad 用 Safari，三星用三星浏览器或 Chrome，华为用华为浏览器），或电脑上的 Chrome / Edge。";n.hidden=false;}
setTimeout(()=>{if(synth&&!synth.getVoices().some(v=>/^en/i.test(v.lang))){const n=$("#notice");n.textContent="这台设备暂时没找到英语语音。安卓/鸿蒙：设置 → 辅助功能 →「文字转语音」里下载英语语音包；苹果：设置 → 辅助功能 → 朗读内容 → 声音 → 英语。";n.hidden=false;}},2500);

let runId=0;
/* ---------- online voices (used when the phone exposes no suitable voice) ---------- */
const netAudio=new Audio(); netAudio.preload="auto"; try{netAudio.setAttribute("playsinline","");}catch(e){}
let netUnlocked=false, netFailed=0;
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function unlockNet(){ if(netUnlocked) return; netUnlocked=true; try{netAudio.src=SILENT; const p=netAudio.play(); if(p&&p.catch) p.catch(()=>{netUnlocked=false;});}catch(e){netUnlocked=false;} }
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockNet,{capture:true,passive:true}));
function chunkText(t){
  const out=[]; let rest=t.trim();
  while(rest.length>180){
    let cut=Math.max(rest.lastIndexOf(". ",180),rest.lastIndexOf("? ",180),rest.lastIndexOf("! ",180),rest.lastIndexOf(", ",180));
    if(cut<60) cut=rest.lastIndexOf(" ",180); if(cut<1) cut=180;
    out.push(rest.slice(0,cut+1).trim()); rest=rest.slice(cut+1).trim();
  }
  if(rest) out.push(rest); return out;
}
function playNetChunk(text,lang){
  return new Promise((res,rej)=>{
    const url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+encodeURIComponent(lang)+"&q="+encodeURIComponent(text);
    let done=false; const fin=ok=>{if(done)return;done=true;clearTimeout(to);netAudio.onended=netAudio.onerror=null;ok?res():rej(new Error("net"));};
    const to=setTimeout(()=>fin(false),12000);
    netAudio.onended=()=>fin(true); netAudio.onerror=()=>fin(false);
    netAudio.src=url; netAudio.playbackRate=Math.max(0.5,Math.min(2,prefs.rate||1));
    try{netAudio.defaultPlaybackRate=netAudio.playbackRate;}catch(e){}
    const p=netAudio.play(); if(p&&p.catch) p.catch(()=>fin(false));
    netAudio.onplaying=()=>{netAudio.playbackRate=Math.max(0.5,Math.min(2,prefs.rate||1));};
  });
}
let netRun=0;
async function speakNet(text,lang){
  const my=++netRun, t0=performance.now();
  for(const c of chunkText(text)){ if(my!==netRun) break; await playNetChunk(c,lang); }
  return (performance.now()-t0)/1000;
}
function stopNet(){netRun++; try{netAudio.pause();}catch(e){}}
if(synth){try{const _c=synth.cancel.bind(synth); synth.cancel=()=>{stopNet();_c();};}catch(e){}}
function speak(text){
  const sel=$("#voice"), name=sel?sel.value:"";
  if(name&&name.startsWith(NET_PREFIX)){
    return speakNet(text,name.slice(NET_PREFIX.length)).then(d=>{netFailed=0;return d;}).catch(()=>{
      netFailed++; if(netFailed===1) toast("网络女声播放失败（可能没联网），这次先用手机自带的声音");
      return speakLocal(text);});
  }
  return speakLocal(text);
}
function speakLocal(text){
  return new Promise(res=>{
    if(!synth){toast("这个浏览器不支持朗读");return res(0);}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=prefs.accent; u.rate=prefs.rate;
    const all=voicesFor(prefs.accent), name=$("#voice").value;
    const list=rankVoices(all,prefs.accent,prefs.gender||"f").map(r=>r.v);
    const v=all.find(x=>x.name===name)||list[0];
    if(v) u.voice=v;
    const t0=performance.now();
    let done=false; const fin=()=>{if(done)return;done=true;clearInterval(keep);res((performance.now()-t0)/1000);};
    u.onend=fin; u.onerror=fin;
    // Chrome pauses long utterances; nudge it
    const keep=setInterval(()=>{if(synth.speaking&&!synth.paused){synth.pause();synth.resume();}},10000);
    synth.speak(u);
  });
}
function wait(ms,id,onTick){
  return new Promise(res=>{const t0=performance.now();
    const step=()=>{if(id!==runId)return res(false);const p=(performance.now()-t0)/ms;onTick&&onTick(Math.min(1,p));if(p>=1)return res(true);requestAnimationFrame(step);};step();});
}
function stopAll(){runId++; if(synth) synth.cancel(); setNow("已停止","点任意条目的 ▶ 播放",""); $("#meter").style.width="0"; markPlaying(null);}
function setNow(t,s,cls){$("#now-t").textContent=t;const e=$("#now-s");e.textContent=s;e.className="s"+(cls?" "+cls:"");}
function markPlaying(id){document.querySelectorAll(".card").forEach(c=>c.classList.toggle("playing",c.dataset.id===id));
  if(id){const c=document.querySelector('.card[data-id="'+id+'"]');c&&c.scrollIntoView({block:"nearest",behavior:"smooth"});}}
const accName=()=>prefs.accent==="en-GB"?"英音":"美音";

function origTokens(text){

function align(orig,heard){ // LCS: which orig tokens appear in order in heard

  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=eq(orig[i],heard[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);

  while(i<n&&j<m){if(eq(orig[i],heard[j])){hit[i]=true;i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}

const DICT_KEY="echo-dict-cache";

async function lookup(w){
  const key=w.toLowerCase();
  if(dictCache[key]&&dictCache[key].done) return dictCache[key];
  const r={done:false,ipaUS:"",ipaUK:"",def:"",zh:""};
  const tasks=[
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(key)).then(x=>x.ok?x.json():null).then(j=>{
      if(!Array.isArray(j)) return;
      const ph=j.flatMap(e=>e.phonetics||[]).filter(p=>p.text);
      const us=ph.find(p=>/-us\./.test(p.audio||"")), uk=ph.find(p=>/-uk\./.test(p.audio||""));
      r.ipaUS=(us||ph[0]||{}).text||j[0].phonetic||""; r.ipaUK=(uk||{}).text||"";
      r.def=j.flatMap(e=>e.meanings||[]).slice(0,3).map(m=>m.partOfSpeech+". "+((m.definitions||[])[0]||{}).definition).join("\n");
    }).catch(()=>{}),
    fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(key)+"&langpair=en|zh-CN").then(x=>x.ok?x.json():null).then(j=>{
      const t=j&&j.responseData&&j.responseData.translatedText; if(t&&!/MYMEMORY|INVALID|QUOTA/i.test(t)&&t.toLowerCase()!==key) r.zh=t;
    }).catch(()=>{})

  await Promise.all(tasks);

  if(r.done){dictCache[key]=r;saveDict();}
  return r;
}

async function wikiImage(zh,en){

  if(en) urls.push("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(en.toLowerCase().replace(/ /g,"_")));
  for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();

const transCache={};
async function translateOptions(text,to){
  const key=to+"|"+text; if(transCache[key]) return transCache[key];
  const out=[]; let pos="";
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+to+"&dt=t&dt=bd&dj=1&q="+encodeURIComponent(text));
    if(r.ok){const j=await r.json();
      const main=(j.sentences||[]).map(x=>x.trans||"").join("").trim(); if(main) out.push(main);
      (j.dict||[]).forEach(d=>{if(!pos)pos=d.pos||"";
        const es=(d.entry||[]).slice().sort((a,b)=>(b.score||0)-(a.score||0)).map(e=>e.word);
        (es.length?es:(d.terms||[])).slice(0,6).forEach(w=>out.push(w));});}
  }catch(e){}
  if(out.length<3){try{
    const lp=to==="en"?"zh-CN|en":"en|zh-CN";
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+lp);
    if(r.ok){const j=await r.json();
      const add=t=>{if(t&&!/MYMEMORY|INVALID|QUOTA/i.test(t))out.push(String(t).trim());};
      add(j.responseData&&j.responseData.translatedText);
      (j.matches||[]).filter(m=>(+m.match||0)>=0.6).forEach(m=>add(m.translation));}
  }catch(e){}}
  const seen=new Set(), opts=[];
  out.forEach(t=>{t=t.replace(/[。．.]$/,to==="en"&&t.split(" ").length<=3?"":"$&").trim();
    const k=t.toLowerCase(); if(!t||seen.has(k)) return;
    if(to==="en"&&CJK.test(t)) return; if(to!=="en"&&!CJK.test(t)) return;
    seen.add(k); opts.push(t);});
  const res={opts:opts.slice(0,10),pos}; if(opts.length) transCache[key]=res; return res;
}

function listenFor(answers,ms,id,isWord,onHeard){
  return new Promise(resolve=>{

    const t=setTimeout(()=>finish(false),ms);

      rec.onresult=e=>{
        const best=Array.from(e.results).map(x=>x[0].transcript).join(" ");

        for(let k=1;k<last.length;k++) list.push(Array.from(e.results).slice(0,-1).map(x=>x[0].transcript).concat(last[k].transcript).join(" "));

  const n=quizRes.length, ok=quizRes.filter(r=>r.ok).length, wrong=quizRes.filter(r=>!r.ok).map(r=>r.it);
  $("#q-prog").textContent=""; $("#q-score").textContent="";
  $("#q-body").innerHTML=`<h2>${ok===n?"全部答对 🎉":"考完了"}</h2>
    <div class="q-big">${ok} / ${n}</div>
    ${wrong.length?`<p class="note">这些没答对，已经放进「⚠ 常读错」：</p><div class="q-list">${wrong.map(it=>`<div><b>${esc(it.en)}</b>${it.zh?" — "+esc(it.zh):""}</div>`).join("")}</div>`:""}
    <div class="q-actions" style="margin-top:8px">
      ${wrong.length?`<button class="btn primary" id="q-again-wrong">只考错的（${wrong.length}）</button>`:""}
      <button class="btn" id="q-again">全部再考一遍</button><button class="btn" id="q-done">完成</button></div>`;
  const w=$("#q-again-wrong"); if(w) w.onclick=()=>showSetup(wrong);
  $("#q-again").onclick=()=>showSetup(quizRes.map(r=>r.it));
  $("#q-done").onclick=closeQuiz;
}
$("#q-close").onclick=closeQuiz;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#quiz").hidden)closeQuiz();});

/* ---------- controls ---------- */
$("#btn-add").onclick=()=>{$("#importer").hidden=true;openEditor(null);};
$("#btn-import").onclick=()=>{closeEditor();const im=$("#importer");im.hidden=!im.hidden;if(!im.hidden)im.scrollIntoView({block:"nearest",behavior:"smooth"});};
$("#imp-close").onclick=()=>{$("#importer").hidden=true;};
$("#imp-img").onchange=e=>{ocrFiles(Array.from(e.target.files||[]));e.target.value="";};
$("#imp-split").onclick=splitImport;
$("#imp-go").onclick=doImport;
$("#imp-all").onclick=()=>{const any=impRows.some(r=>!r.on);impRows.forEach(r=>r.on=any);renderImport();};
$("#btn-export").onclick=exportData;
$("#imp").onchange=e=>{importData(e.target.files[0]);e.target.value="";};
$("#q").oninput=e=>{query=e.target.value;render();};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
$("#btn-playall").onclick=()=>playItems(visibleItems(),false);
$("#btn-shadowall").onclick=()=>playItems(visibleItems(),true);
$("#btn-quiz").onclick=openQuiz;
$("#btn-stop").onclick=()=>{if(recog)try{recog.abort();}catch(e){}if(mediaRec)mediaRec.stop();stopAll();};
function setAccent(a){prefs.accent=a;savePrefs();$("#acc-us").setAttribute("aria-pressed",String(a==="en-US"));$("#acc-uk").setAttribute("aria-pressed",String(a==="en-GB"));fillVoiceSelect();
  if(voices.length&&!voicesFor(a).length) toast("这台设备没装"+(a==="en-GB"?"英音":"美音")+"语音，会用默认声音");}
$("#acc-us").onclick=()=>setAccent("en-US"); $("#acc-uk").onclick=()=>setAccent("en-GB");
$("#rate").value=prefs.rate; $("#rate-v").textContent=Number(prefs.rate).toFixed(2);
$("#rate").oninput=e=>{prefs.rate=+e.target.value;$("#rate-v").textContent=prefs.rate.toFixed(2);savePrefs();};
$("#reps").value=String(prefs.reps); $("#reps").onchange=e=>{prefs.reps=+e.target.value;savePrefs();};
function setGender(g){prefs.gender=g;prefs.voiceUS="";prefs.voiceUK="";savePrefs();const n=$("#notice");if(n)n.hidden=true;fillVoiceSelect();
  const v=$("#voice").value; if(synth&&v){synth.cancel();++runId;speak(prefs.accent==="en-GB"?"Hello, lovely to meet you.":"Hi, nice to meet you.");}}
$("#g-f").onclick=()=>setGender("f"); $("#g-m").onclick=()=>setGender("m");
$("#voice").onchange=e=>{prefs[prefs.accent==="en-GB"?"voiceUK":"voiceUS"]=e.target.value;savePrefs();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input,textarea,select")){if(mediaRec)mediaRec.stop();stopAll();}});
let tt; function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200);}

setAccent(prefs.accent);
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
})();
</script>
</body>
</html>
